<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncing Particles</title>
<meta name="description" content="Elastic collisions with wall reflection.">
<style>
  body {
    margin: 0;
    background: #0f1115;
    color: #e6e9ef;
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    gap: 14px;
  }
  canvas { border-radius: 10px; border: 1px solid #262b36; cursor: crosshair; }
  .hint { color: #8b93a7; font-size: 13px; }
</style>
</head>
<body>
  <h2 style="margin:0">Bouncing Particles</h2>
  <canvas id="c" width="640" height="420"></canvas>
  <p class="hint">click to spawn · <kbd>R</kbd> to clear</p>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const COLORS = ['#4fc3f7', '#7c9cff', '#f78fb3', '#ffd166', '#8ce99a'];
  const particles = [];

  function spawn(x, y) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.8 + Math.random() * 2.4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 4 + Math.random() * 7,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
    });
  }

  function step() {
    ctx.fillStyle = '#0f1115';
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < particles.length; i += 1) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;

      if (p.x - p.r < 0) { p.x = p.r; p.vx = Math.abs(p.vx); }
      if (p.x + p.r > W) { p.x = W - p.r; p.vx = -Math.abs(p.vx); }
      if (p.y - p.r < 0) { p.y = p.r; p.vy = Math.abs(p.vy); }
      if (p.y + p.r > H) { p.y = H - p.r; p.vy = -Math.abs(p.vy); }

      // pairwise elastic collision resolution
      for (let j = i + 1; j < particles.length; j += 1) {
        const q = particles[j];
        const dx = q.x - p.x;
        const dy = q.y - p.y;
        const dist = Math.hypot(dx, dy);
        const minDist = p.r + q.r;

        if (dist > 0 && dist < minDist) {
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = (minDist - dist) / 2;
          p.x -= nx * overlap; p.y -= ny * overlap;
          q.x += nx * overlap; q.y += ny * overlap;

          const pvn = p.vx * nx + p.vy * ny;
          const qvn = q.vx * nx + q.vy * ny;
          p.vx -= (qvn - pvn) * nx;
          p.vy -= (qvn - pvn) * ny;
          q.vx += (qvn - pvn) * nx;
          q.vy += (qvn - pvn) * ny;
        }
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }

    requestAnimationFrame(step);
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    spawn(e.clientX - rect.left, e.clientY - rect.top);
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') particles.length = 0;
  });

  for (let i = 0; i < 40; i += 1) {
    spawn(40 + Math.random() * (W - 80), 40 + Math.random() * (H - 80));
  }

  requestAnimationFrame(step);
</script>
</body>
</html>
